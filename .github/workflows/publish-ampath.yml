name: AMPATH Package Publishing

on:
  push:
    branches: [main]
  release:
    types:
      - created

# Trusted Publisher (OIDC) requires id-token: write.
# On npmjs.com → @ampath/esm-patient-care-workflows-app → Settings → Trusted Publisher:
#   Organization: AMPATH
#   Repository:   ampath-esm-patient-care-workflows
#   Workflow:     publish-ampath.yml
#   Environment:  (leave blank unless this job sets `environment:` below)
permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 📦 Install dependencies
        run: yarn install --immutable

      - name: 🔧 Run type checks
        run: yarn typescript

      - name: 🏗️ Build
        run: yarn build

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          overwrite: true

  publish-next:
    runs-on: ubuntu-latest
    needs: build
    if: >
      github.event_name == 'push' && 
      github.ref == 'refs/heads/main' &&
      github.repository_owner == 'AMPATH'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: ⬆️ Ensure npm supports Trusted Publisher OIDC
        run: |
          npm install -g npm@latest
          node --version
          npm --version

      - name: 🔍 Print OIDC identity (compare to npm Trusted Publisher config)
        uses: actions/github-script@v7
        with:
          script: |
            const core = require('@actions/core');
            const token = await core.getIDToken('npm:registry.npmjs.org');
            const payload = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
            core.info(`repository: ${payload.repository}`);
            core.info(`workflow_ref: ${payload.workflow_ref}`);
            core.info(`ref: ${payload.ref}`);
            core.info(`environment: ${payload.environment ?? '(none — leave blank on npm)'}`);
            const workflowFile = (payload.workflow_ref || '').split('/').pop()?.split('@')[0];
            core.info(`workflow filename for npm: ${workflowFile}`);

      - name: 📦 Install dependencies
        run: yarn install --immutable

      - name: 🔧 Configure Git
        run: |
          git config user.email "devs@ampath.or.ke" 
          git config user.name "AMPATH CI"

      - name: 🏷️ Version with next tag
        run: |
          CURRENT_VERSION=$(node -e "console.log(require('./package.json').version)")
          NEXT_VERSION="${CURRENT_VERSION}-next.${{ github.run_number }}"
          yarn version $NEXT_VERSION --immediate
          echo "Publishing version: $NEXT_VERSION"

      - name: 🏗️ Build
        run: yarn build

      - name: 📦 Publish to npm with next tag
        env:
          HUSKY: '0'
        run: |
          # Publish must use OIDC — do not pass NODE_AUTH_TOKEN / NPM_TOKEN here.
          npm publish --tag next --access public

  publish-release:
    runs-on: ubuntu-latest
    needs: build
    if: >
      github.event_name == 'release' &&
      github.repository_owner == 'AMPATH'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: ⬆️ Ensure npm supports Trusted Publisher OIDC
        run: |
          npm install -g npm@latest
          node --version
          npm --version

      - name: 🔍 Print OIDC identity (compare to npm Trusted Publisher config)
        uses: actions/github-script@v7
        with:
          script: |
            const core = require('@actions/core');
            const token = await core.getIDToken('npm:registry.npmjs.org');
            const payload = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
            core.info(`repository: ${payload.repository}`);
            core.info(`workflow_ref: ${payload.workflow_ref}`);
            core.info(`ref: ${payload.ref}`);
            core.info(`environment: ${payload.environment ?? '(none — leave blank on npm)'}`);
            const workflowFile = (payload.workflow_ref || '').split('/').pop()?.split('@')[0];
            core.info(`workflow filename for npm: ${workflowFile}`);

      - name: 📦 Install dependencies
        run: yarn install --immutable

      - name: 🏷️ Set release version
        run: |
          RELEASE_VERSION=${{ github.ref_name }}
          RELEASE_VERSION=${RELEASE_VERSION#v}
          yarn version $RELEASE_VERSION --immediate
          echo "Publishing release version: $RELEASE_VERSION"

      - name: 🏗️ Build
        run: yarn build

      - name: 📦 Publish to npm with latest tag
        env:
          HUSKY: '0'
        run: npm publish --tag latest --access public
