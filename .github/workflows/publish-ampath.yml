name: AMPATH Package Publishing

on:
  push:
    branches: [main]
  release:
    types:
      - created

# Trusted Publisher (OIDC) requires id-token: write.
# On npmjs.com → @ampath/esm-patient-care-workflows-app → Settings → Trusted Publisher:
#   Organization: AMPATH          (case-sensitive — must match GitHub exactly)
#   Repository:   ampath-esm-patient-care-workflows
#   Workflow:     publish-ampath.yml
#   Environment:  (leave blank)
#   Allowed actions: check "npm publish"  ← required for configs created after 2026-05-20
permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 📦 Install dependencies
        run: yarn install --immutable

      - name: 🔧 Run type checks
        run: yarn typescript

      - name: 🏗️ Build
        run: yarn build

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          overwrite: true

  publish-next:
    runs-on: ubuntu-latest
    needs: build
    if: >
      github.event_name == 'push' && 
      github.ref == 'refs/heads/main' &&
      github.repository_owner == 'AMPATH'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          # Do NOT set registry-url — it injects a fake NODE_AUTH_TOKEN and blocks OIDC.

      - name: ⬆️ Ensure npm supports Trusted Publisher OIDC
        run: |
          npm install -g npm@latest
          node --version
          npm --version

      - name: 🔍 Verify OIDC identity + package.json repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const token = await core.getIDToken('npm:registry.npmjs.org');
            const payload = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
            const workflowFile = (payload.workflow_ref || '').split('@')[0].split('/').pop();
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const expectedRepoUrl = `https://github.com/${payload.repository}`;

            core.info('=== Values npm Trusted Publisher must match ===');
            core.info(`Organization: ${(payload.repository || '').split('/')[0]}`);
            core.info(`Repository:   ${(payload.repository || '').split('/')[1]}`);
            core.info(`Workflow:     ${workflowFile}`);
            core.info(`Environment:  ${payload.environment ?? '(blank)'}`);
            core.info(`package.json repository.url: ${pkg.repository?.url}`);
            core.info(`expected repository.url:     ${expectedRepoUrl}`);

            if (pkg.repository?.url !== expectedRepoUrl && pkg.repository?.url !== `${expectedRepoUrl}.git` && pkg.repository?.url !== `git+${expectedRepoUrl}.git`) {
              core.warning(`repository.url may not match GitHub OIDC claim. Prefer exactly: ${expectedRepoUrl}`);
            }
            if (!process.env.ACTIONS_ID_TOKEN_REQUEST_URL) {
              core.setFailed('ACTIONS_ID_TOKEN_REQUEST_URL missing — id-token: write is not effective');
            }

      - name: 📦 Install dependencies
        run: yarn install --immutable

      - name: 🔧 Configure Git
        run: |
          git config user.email "devs@ampath.or.ke" 
          git config user.name "AMPATH CI"

      - name: 🏷️ Version with next tag
        run: |
          CURRENT_VERSION=$(node -e "console.log(require('./package.json').version)")
          NEXT_VERSION="${CURRENT_VERSION}-next.${{ github.run_number }}"
          yarn version $NEXT_VERSION --immediate
          echo "Publishing version: $NEXT_VERSION"

      - name: 🏗️ Build
        run: yarn build

      - name: 📦 Publish to npm with next tag
        env:
          HUSKY: '0'
        run: |
          unset NODE_AUTH_TOKEN NPM_TOKEN YARN_NPM_AUTH_TOKEN NPM_CONFIG_USERCONFIG
          rm -f "$HOME/.npmrc" .npmrc
          echo "OIDC request URL present: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          # verbose logs should show: "OIDC is available - using npm trusted publishing"
          npm publish --tag next --access public --registry https://registry.npmjs.org/ --loglevel verbose

  publish-release:
    runs-on: ubuntu-latest
    needs: build
    if: >
      github.event_name == 'release' &&
      github.repository_owner == 'AMPATH'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: ⬆️ Ensure npm supports Trusted Publisher OIDC
        run: |
          npm install -g npm@latest
          node --version
          npm --version

      - name: 📦 Install dependencies
        run: yarn install --immutable

      - name: 🏷️ Set release version
        run: |
          RELEASE_VERSION=${{ github.ref_name }}
          RELEASE_VERSION=${RELEASE_VERSION#v}
          yarn version $RELEASE_VERSION --immediate
          echo "Publishing release version: $RELEASE_VERSION"

      - name: 🏗️ Build
        run: yarn build

      - name: 📦 Publish to npm with latest tag
        env:
          HUSKY: '0'
        run: |
          unset NODE_AUTH_TOKEN NPM_TOKEN YARN_NPM_AUTH_TOKEN NPM_CONFIG_USERCONFIG
          rm -f "$HOME/.npmrc" .npmrc
          npm publish --tag latest --access public --registry https://registry.npmjs.org/ --loglevel verbose
