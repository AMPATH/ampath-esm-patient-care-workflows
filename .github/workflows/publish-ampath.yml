name: AMPATH Package Publishing

on:
  push:
    branches: [main]
  release:
    types:
      - created

# Trusted Publisher (OIDC) requires id-token: write.
# Workflow filename must match what is configured on npmjs.com (publish-ampath.yml).
permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 📦 Install dependencies
        run: yarn install --immutable

      - name: 🔧 Run type checks
        run: yarn typescript

      - name: 🏗️ Build
        run: yarn build

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          overwrite: true

  publish-next:
    runs-on: ubuntu-latest
    needs: build
    if: >
      github.event_name == 'push' && 
      github.ref == 'refs/heads/main' &&
      github.repository_owner == 'AMPATH'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: 📦 Install dependencies
        run: yarn install --immutable

      - name: 🔧 Configure Git
        run: |
          git config user.email "devs@ampath.or.ke" 
          git config user.name "AMPATH CI"

      - name: 🏷️ Version with next tag
        run: |
          CURRENT_VERSION=$(node -e "console.log(require('./package.json').version)")
          NEXT_VERSION="${CURRENT_VERSION}-next.${{ github.run_number }}"
          yarn version $NEXT_VERSION --immediate
          echo "Publishing version: $NEXT_VERSION"

      - name: 🏗️ Build
        run: yarn build

      - name: 📦 Publish to npm with next tag
        # Use npm (not yarn) so OIDC Trusted Publisher auth works.
        # Do not set NODE_AUTH_TOKEN / YARN_NPM_AUTH_TOKEN here.
        run: npm publish --tag next --access public

  publish-release:
    runs-on: ubuntu-latest
    needs: build
    if: >
      github.event_name == 'release' &&
      github.repository_owner == 'AMPATH'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: 📦 Install dependencies
        run: yarn install --immutable

      - name: 🏷️ Set release version
        run: |
          RELEASE_VERSION=${{ github.ref_name }}
          RELEASE_VERSION=${RELEASE_VERSION#v}
          yarn version $RELEASE_VERSION --immediate
          echo "Publishing release version: $RELEASE_VERSION"

      - name: 🏗️ Build
        run: yarn build

      - name: 📦 Publish to npm with latest tag
        run: npm publish --tag latest --access public
